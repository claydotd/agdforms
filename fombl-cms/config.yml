# FoMBL Decap CMS — hosted here so Netlify OAuth can return the token
# (Netlify only completes login when the CMS origin matches this site).
# Edits commit to claydotd/fombl on GitHub.

backend:
  name: github
  repo: claydotd/fombl
  branch: main
  site_domain: agdforms.netlify.app

site_url: https://agdforms.netlify.app/fombl-cms/
logo_url: FomblLogo.jpg

publish_mode: simple
media_folder: public/images
public_folder: /images

collections:
  - name: meetings
    label: Meetings
    files:
      - name: meetings
        label: Meetings
        file: src/content/data/meetings.json
        format: json
        fields:
          - label: Meetings
            name: items
            widget: list
            summary: "{{title}} — {{date}}"
            fields:
              - { label: ID, name: id, widget: string, hint: "URL anchor, e.g. agm-2027" }
              - { label: Kind, name: kind, widget: string, hint: "AGM, Party, Meeting, …" }
              - { label: Title, name: title, widget: string }
              - { label: Date, name: date, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false }
              - { label: Time, name: time, widget: string, required: false }
              - { label: Place, name: place, widget: string }
              - { label: Summary, name: summary, widget: text }
              - { label: Tag, name: tag, widget: string, required: false, hint: "Optional badge, e.g. Members and Invite Only" }

  - name: saturday_sessions
    label: Saturday sessions
    files:
      - name: saturday-sessions
        label: Saturday sessions
        file: src/content/data/saturday-sessions.json
        format: json
        fields:
          - label: Sessions
            name: items
            widget: list
            summary: "{{date}}"
            fields:
              - { label: Date, name: date, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false }
              - { label: Note, name: note, widget: text, required: false }
              - { label: Contact line, name: contact, widget: string, required: false }

  - name: friday_sessions
    label: Friday sessions
    files:
      - name: friday-sessions
        label: Friday sessions
        file: src/content/data/friday-sessions.json
        format: json
        fields:
          - label: Sessions
            name: items
            widget: list
            summary: "{{date}} — {{place}}"
            fields:
              - { label: Date, name: date, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false }
              - { label: Time, name: time, widget: string, required: false, hint: "e.g. 1:30pm" }
              - { label: Meeting place, name: place, widget: string, required: false }
              - { label: Note, name: note, widget: text, required: false }
              - { label: Contact line, name: contact, widget: string, required: false }

  - name: news
    label: News posts
    label_singular: News post
    folder: public/news
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false }
      - { label: Summary, name: summary, widget: text }
      - { label: Body, name: body, widget: markdown }
