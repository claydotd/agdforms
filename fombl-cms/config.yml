# FoMBL Decap CMS — hosted here so Netlify OAuth can return the token
# (Netlify only completes login when the CMS origin matches this site).
# Edits commit to claydotd/fombl on GitHub.

backend:
  name: github
  repo: claydotd/fombl
  branch: main
  site_domain: agdforms.netlify.app

site_url: https://agdforms.netlify.app/fombl-cms/
logo_url: FomblLogo.jpg

publish_mode: simple
media_folder: public/images
public_folder: /images

collections:
  - name: meetings
    label: Meetings & Events
    label_singular: Meeting or event
    description: >-
      AGMs, parties, and other one-off meetings shown on the Events page.
      Click “New meeting or event” to add one. The filename becomes the page
      link anchor (e.g. agm-2027).
    folder: src/content/data/meetings
    create: true
    extension: json
    format: json
    slug: "{{slug}}"
    summary: "{{kind}} — {{title}} ({{date}})"
    sortable_fields: ["date", "title", "kind"]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false }
      - { label: Time, name: time, widget: string, required: false, hint: "e.g. 6:00–8:30pm" }
      - { label: Place, name: place, widget: string }
      - { label: Summary, name: summary, widget: text, hint: "Short description shown under the title" }
      - label: Type
        name: kind
        widget: select
        options: ["AGM", "Party", "Meeting", "Other"]
        default: Meeting
      - label: Audience badge
        name: tag
        widget: string
        required: false
        hint: "Optional label shown on the listing, e.g. Members and Invite Only"

  - name: volunteering
    label: Volunteering
    label_singular: Session
    description: >-
      Dated Friday workdays and Saturday volunteer mornings. Choose the day,
      set the date, and fill in place or notes only when they differ from the
      usual pattern.
    folder: src/content/data/sessions
    create: true
    extension: json
    format: json
    slug: "{{fields.day}}-{{fields.date}}"
    summary: "{{day}} — {{date}}"
    sortable_fields: ["date", "day"]
    fields:
      - label: Day
        name: day
        widget: select
        options:
          - { label: Friday, value: friday }
          - { label: Saturday, value: saturday }
        default: friday
      - { label: Date, name: date, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false }
      - { label: Time, name: time, widget: string, required: false, hint: "e.g. 1:30pm (Friday) or 10:00am (Saturday)" }
      - { label: Meeting place, name: place, widget: string, required: false, hint: "Leave blank if the usual place applies" }
      - { label: Note, name: note, widget: text, required: false, hint: "Extra detail for this date only" }
      - label: Contact line
        name: contact
        widget: string
        required: false
        hint: "Optional full sentence, e.g. Contact projects@fombl.org.uk if you have any questions"

  - name: news
    label: News
    label_singular: News post
    description: >-
      Short news posts on the News page. Newsletter PDFs are managed separately
      by a developer.
    folder: public/news
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false }
      - { label: Summary, name: summary, widget: text, hint: "One or two sentences shown in the news list" }
      - { label: Body, name: body, widget: markdown, hint: "Full post. You can add links with the link button." }
